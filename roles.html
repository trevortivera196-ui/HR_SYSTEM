<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Roles & Permissions — PeopleCore HR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body{background:#f8fafc;}
    .dash-layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
    .sidebar{background:var(--dark);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
    .sidebar-logo{padding:1.25rem 1.25rem 0;display:flex;align-items:center;gap:.55rem;font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:1rem;}
    .sidebar-logo .logo-icon{width:32px;height:32px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:.9rem;}
    .sidebar-divider{height:1px;background:rgba(255,255,255,.08);margin:.5rem 1rem;}
    .sidebar-nav{flex:1;padding:0 .75rem;}
    .sidebar-footer{padding:1rem;border-top:1px solid rgba(255,255,255,.08);}
    .user-chip{display:flex;align-items:center;gap:.65rem;padding:.6rem .5rem;border-radius:8px;}
    .user-chip .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff;flex-shrink:0;}
    .user-chip strong{display:block;font-size:.85rem;color:#fff;line-height:1.2;}
    .user-chip span{font-size:.75rem;color:rgba(255,255,255,.4);}
    .dash-main{padding:2rem;overflow-y:auto;}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}

    .sc{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:1.5rem;overflow:hidden;}
    .sc-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.5rem;border-bottom:1px solid var(--gray-100);}
    .sc-head h3{margin:0;font-size:1rem;}

    /* Role card */
    .role-card{border:1.5px solid var(--gray-100);border-radius:12px;padding:1.25rem;transition:border-color .2s,box-shadow .2s;cursor:pointer;}
    .role-card:hover,.role-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.08);}
    .role-card.selected{background:#eff6ff;}
    .role-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:.75rem;}
    .role-name{font-weight:700;font-size:.95rem;color:var(--gray-900);margin-bottom:.25rem;}
    .role-desc{font-size:.8rem;color:var(--gray-500);margin-bottom:.75rem;line-height:1.5;}
    .role-users{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--gray-500);}

    /* Permission matrix */
    .perm-table{width:100%;border-collapse:collapse;}
    .perm-table th{background:var(--gray-100);padding:.7rem 1rem;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);border-bottom:1px solid var(--gray-300);text-align:left;}
    .perm-table th:not(:first-child){text-align:center;}
    .perm-table td{padding:.7rem 1rem;border-bottom:1px solid var(--gray-100);font-size:.88rem;color:var(--gray-700);vertical-align:middle;}
    .perm-table td:not(:first-child){text-align:center;}
    .perm-table tr:last-child td{border-bottom:none;}
    .perm-table tbody tr:hover{background:var(--gray-100);}
    .perm-section-row td{background:var(--gray-100);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);padding:.5rem 1rem;}

    /* Checkbox */
    .perm-cb{width:18px;height:18px;cursor:pointer;accent-color:var(--primary);}
    .check-icon{color:var(--success);font-size:1.1rem;}
    .cross-icon{color:var(--gray-300);font-size:1.1rem;}

    /* User assignment */
    .assign-row{display:flex;align-items:center;gap:.75rem;padding:.85rem 1.25rem;border-bottom:1px solid var(--gray-100);transition:background .15s;}
    .assign-row:hover{background:var(--gray-100);}
    .assign-row:last-child{border-bottom:none;}
    .assign-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;color:#fff;flex-shrink:0;}

    @media(max-width:1024px){.dash-layout{grid-template-columns:1fr;}.sidebar{display:none;}}
  </style>
</head>
<body>
<div class="dash-layout">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="dash-main">
    <div class="topbar">
      <div>
        <h2>🔒 Roles & Permissions</h2>
        <p style="margin:0;font-size:.88rem;color:var(--gray-500);">Control access levels and what each role can see and do.</p>
      </div>
      <div style="display:flex;gap:.75rem;">
        <button class="btn btn-outline btn-sm" onclick="showToast('Audit log exported','info')">⬇ Audit Log</button>
        <button class="btn btn-primary" data-modal-open="newRoleModal">+ Create Role</button>
      </div>
    </div>

    <!-- Tabs -->
    <div data-tabs>
      <div class="tabs">
        <button class="tab-btn active" data-tab="roles">Roles</button>
        <button class="tab-btn" data-tab="matrix">Permissions Matrix</button>
        <button class="tab-btn" data-tab="users">User Assignments</button>
        <button class="tab-btn" data-tab="audit">Audit Log</button>
      </div>

      <!-- ROLES -->
      <div class="tab-panel active" id="tab-roles">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem;margin-bottom:1.5rem;" id="rolesGrid"></div>
        <div class="sc" id="roleDetail" style="display:none;">
          <div class="sc-head"><h3 id="roleDetailTitle">Role Details</h3>
            <div style="display:flex;gap:.5rem;">
              <button class="btn btn-outline btn-sm" onclick="showToast('Role duplicated','info')">Duplicate</button>
              <button class="btn btn-primary btn-sm" onclick="showToast('Role saved','success')">Save Changes</button>
            </div>
          </div>
          <div style="padding:1.5rem;" id="roleDetailBody"></div>
        </div>
      </div>

      <!-- MATRIX -->
      <div class="tab-panel" id="tab-matrix">
        <div class="sc">
          <div class="sc-head">
            <h3>Permissions Matrix</h3>
            <div style="display:flex;gap:.4rem;align-items:center;font-size:.8rem;color:var(--gray-500);">
              <span style="color:var(--success);">✓ = Allowed</span>
              <span style="color:var(--gray-300);margin-left:.75rem;">✕ = Denied</span>
            </div>
          </div>
          <div style="overflow-x:auto;">
            <table class="perm-table" id="matrixTable"></table>
          </div>
        </div>
      </div>

      <!-- USER ASSIGNMENTS -->
      <div class="tab-panel" id="tab-users">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem;">
          <input class="search-input" style="max-width:260px;padding:.45rem .9rem;font-size:.88rem;" placeholder="🔍 Search users…" id="userSearch"/>
          <select class="filter-select" id="roleFilter">
            <option value="">All Roles</option>
            <option>Super Admin</option><option>HR Manager</option><option>HR Specialist</option><option>Manager</option><option>Employee</option>
          </select>
        </div>
        <div class="sc">
          <div id="userAssignList"></div>
        </div>
      </div>

      <!-- AUDIT LOG -->
      <div class="tab-panel" id="tab-audit">
        <div class="sc">
          <div class="sc-head"><h3>Audit Log</h3><span class="badge badge-blue">Last 30 days</span></div>
          <div style="overflow-x:auto;">
            <table class="data-table">
              <thead><tr><th>User</th><th>Action</th><th>Target</th><th>Date & Time</th><th>IP Address</th></tr></thead>
              <tbody id="auditBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- New Role Modal -->
<div class="modal-overlay" id="newRoleModal">
  <div class="modal">
    <div class="modal-header"><h3>Create New Role</h3><button class="modal-close" data-modal-close="newRoleModal">✕</button></div>
    <div class="modal-body">
      <form id="newRoleForm">
        <div class="form-group"><label class="form-label">Role Name *</label><input name="name" class="form-control" placeholder="e.g. Payroll Specialist" required/></div>
        <div class="form-group"><label class="form-label">Description</label><textarea name="desc" class="form-control" rows="2" placeholder="What can this role do?"></textarea></div>
        <div class="form-group"><label class="form-label">Copy Permissions From</label>
          <select name="copyFrom" class="form-control"><option>— Start from scratch —</option><option>Employee</option><option>HR Specialist</option><option>HR Manager</option></select></div>
        <div class="modal-footer" style="padding:0;border:none;margin-top:1rem;">
          <button type="button" class="btn btn-outline" data-modal-close="newRoleModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Role</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="sidebar.js"></script>
<script>
const roles=[
  {id:'sa',  name:'Super Admin',  icon:'👑', bg:'#fef3c7', desc:'Full unrestricted access to all modules, settings, and data.', users:2,  color:'#d97706'},
  {id:'hrm', name:'HR Manager',   icon:'👔', bg:'#dbeafe', desc:'Manage employees, payroll, leave, and run reports across the org.', users:5, color:'#2563eb'},
  {id:'hrs', name:'HR Specialist',icon:'📋', bg:'#dcfce7', desc:'Process leave requests, update employee records, and assist with recruitment.', users:12, color:'#16a34a'},
  {id:'mgr', name:'Manager',      icon:'🗂️', bg:'#ede9fe', desc:'View team members, approve leave, and run department-level performance reviews.', users:34, color:'#7c3aed'},
  {id:'emp', name:'Employee',     icon:'👤', bg:'#f1f5f9', desc:'View own profile, request leave, complete training, and access payslips.', users:195, color:'#64748b'},
  {id:'rec', name:'Recruiter',    icon:'🔍', bg:'#fee2e2', desc:'Post jobs, manage candidates, and move applicants through the pipeline.', users:8,  color:'#dc2626'},
];

let selectedRole=null;
const rg=document.getElementById('rolesGrid');
function renderRoles(){
  rg.innerHTML=roles.map(r=>`
    <div class="role-card${selectedRole===r.id?' selected':''}" onclick="selectRole('${r.id}')">
      <div class="role-icon" style="background:${r.bg};">${r.icon}</div>
      <div class="role-name">${r.name}</div>
      <div class="role-desc">${r.desc}</div>
      <div role="users" style="display:flex;align-items:center;justify-content:space-between;">
        <span class="role-users">👥 ${r.users} users</span>
        <div style="display:flex;gap:.3rem;">
          <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();editRole('${r.id}')">Edit</button>
          ${r.id!=='sa'?`<button class="btn btn-sm" style="background:#fee2e2;color:var(--danger);" onclick="event.stopPropagation();deleteRole('${r.id}')">Delete</button>`:''}
        </div>
      </div>
    </div>`).join('');
}
renderRoles();

function selectRole(id){
  selectedRole=id;
  renderRoles();
  const r=roles.find(x=>x.id===id);
  document.getElementById('roleDetailTitle').textContent=`${r.icon} ${r.name} — Permissions`;
  document.getElementById('roleDetail').style.display='block';
  // Mini permission list for selected role
  const perms=permMatrix.filter(p=>typeof p.perms==='object');
  document.getElementById('roleDetailBody').innerHTML=`
    <p style="font-size:.88rem;color:var(--gray-500);margin-bottom:1rem;">${r.desc} · <strong>${r.users} users assigned</strong></p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem;">
      ${perms.map(p=>{
        const has=p.perms[id];
        return `<div style="display:flex;align-items:center;gap:.5rem;padding:.55rem .85rem;border-radius:8px;background:${has?'#f0fdf4':'var(--gray-100)'};">
          <span style="font-size:1rem;">${has?'✅':'⬜'}</span>
          <span style="font-size:.82rem;font-weight:${has?'600':'400'};color:${has?'var(--gray-900)':'var(--gray-400)'};">${p.action}</span>
        </div>`;
      }).join('')}
    </div>`;
  document.getElementById('roleDetail').scrollIntoView({behavior:'smooth'});
}
function editRole(id){
  const r=roles.find(x=>x.id===id);
  showToast(`Editing ${r.name}…`,'info');
}
function deleteRole(id){
  if(confirm('Delete this role? Users will be reassigned to Employee.')){
    roles.splice(roles.findIndex(r=>r.id===id),1);
    renderRoles();
    document.getElementById('roleDetail').style.display='none';
    showToast('Role deleted','success');
  }
}

// Permissions matrix data
const permMatrix=[
  {section:'Employees'},
  {action:'View employee list',        perms:{sa:1,hrm:1,hrs:1,mgr:1,emp:0,rec:0}},
  {action:'View employee details',     perms:{sa:1,hrm:1,hrs:1,mgr:1,emp:0,rec:0}},
  {action:'Add / edit employees',      perms:{sa:1,hrm:1,hrs:1,mgr:0,emp:0,rec:0}},
  {action:'Delete employees',          perms:{sa:1,hrm:1,hrs:0,mgr:0,emp:0,rec:0}},
  {section:'Payroll'},
  {action:'View payslips (own)',        perms:{sa:1,hrm:1,hrs:1,mgr:1,emp:1,rec:1}},
  {action:'View payslips (all)',        perms:{sa:1,hrm:1,hrs:0,mgr:0,emp:0,rec:0}},
  {action:'Run payroll',               perms:{sa:1,hrm:1,hrs:0,mgr:0,emp:0,rec:0}},
  {section:'Leave'},
  {action:'Request leave',             perms:{sa:1,hrm:1,hrs:1,mgr:1,emp:1,rec:1}},
  {action:'Approve team leave',        perms:{sa:1,hrm:1,hrs:1,mgr:1,emp:0,rec:0}},
  {action:'Approve all leave',         perms:{sa:1,hrm:1,hrs:0,mgr:0,emp:0,rec:0}},
  {section:'Recruitment'},
  {action:'View job listings',         perms:{sa:1,hrm:1,hrs:1,mgr:1,emp:1,rec:1}},
  {action:'Post jobs',                 perms:{sa:1,hrm:1,hrs:0,mgr:0,emp:0,rec:1}},
  {action:'Manage candidates',         perms:{sa:1,hrm:1,hrs:1,mgr:0,emp:0,rec:1}},
  {section:'Performance'},
  {action:'View own review',           perms:{sa:1,hrm:1,hrs:1,mgr:1,emp:1,rec:1}},
  {action:'Give feedback',             perms:{sa:1,hrm:1,hrs:1,mgr:1,emp:1,rec:0}},
  {action:'Manage review cycles',      perms:{sa:1,hrm:1,hrs:0,mgr:0,emp:0,rec:0}},
  {section:'Settings & Admin'},
  {action:'View settings',             perms:{sa:1,hrm:1,hrs:0,mgr:0,emp:0,rec:0}},
  {action:'Edit company settings',     perms:{sa:1,hrm:0,hrs:0,mgr:0,emp:0,rec:0}},
  {action:'Manage roles & permissions',perms:{sa:1,hrm:0,hrs:0,mgr:0,emp:0,rec:0}},
];
const roleHeaders=roles.map(r=>`<th>${r.icon} ${r.name}</th>`).join('');
let matrixHtml=`<thead><tr><th>Permission</th>${roleHeaders}</tr></thead><tbody>`;
permMatrix.forEach(row=>{
  if(row.section){
    matrixHtml+=`<tr class="perm-section-row"><td colspan="${roles.length+1}">${row.section}</td></tr>`;
  } else {
    const cells=roles.map(r=>{
      const has=row.perms[r.id];
      return `<td><input type="checkbox" class="perm-cb" ${has?'checked':''} onchange="permChanged(this,'${r.id}','${row.action}')"/></td>`;
    }).join('');
    matrixHtml+=`<tr><td>${row.action}</td>${cells}</tr>`;
  }
});
matrixHtml+='</tbody>';
document.getElementById('matrixTable').innerHTML=matrixHtml;

function permChanged(cb, roleId, action){
  showToast(`${action} ${cb.checked?'granted to':'revoked from'} ${roles.find(r=>r.id===roleId).name}`,'info');
}

// User assignments
const users=[
  {name:'Admin User',      init:'A',  col:'#2563eb', role:'Super Admin', email:'admin@peoplecore.io',    last:'Sep 16, 2026'},
  {name:'Sarah Mitchell',  init:'SM', col:'#7c3aed', role:'Employee',    email:'s.mitchell@pc.io',       last:'Sep 16, 2026'},
  {name:'James Okafor',    init:'JO', col:'#16a34a', role:'Manager',     email:'j.okafor@pc.io',         last:'Sep 15, 2026'},
  {name:'Elena Vasquez',   init:'EV', col:'#d97706', role:'HR Specialist',email:'e.vasquez@pc.io',       last:'Sep 14, 2026'},
  {name:'Tom Henderson',   init:'TH', col:'#dc2626', role:'Manager',     email:'t.henderson@pc.io',      last:'Sep 13, 2026'},
  {name:'Priya Nair',      init:'PN', col:'#ef4444', role:'Employee',    email:'p.nair@pc.io',           last:'Sep 10, 2026'},
  {name:'Carlos Rivera',   init:'CR', col:'#0ea5e9', role:'Employee',    email:'c.rivera@pc.io',         last:'Sep 16, 2026'},
  {name:'Amara Diallo',    init:'AD', col:'#0f766e', role:'HR Manager',  email:'a.diallo@pc.io',         last:'Sep 12, 2026'},
];
function renderUsers(data){
  document.getElementById('userAssignList').innerHTML=data.map(u=>{
    const rc=u.role==='Super Admin'?'badge-yellow':u.role.includes('Manager')?'badge-blue':u.role==='HR Specialist'?'badge-green':'badge-purple';
    return `<div class="assign-row">
      <div class="assign-avatar" style="background:${u.col};">${u.init}</div>
      <div style="flex:1;">
        <strong style="display:block;font-size:.88rem;">${u.name}</strong>
        <span style="font-size:.76rem;color:var(--gray-500);">${u.email}</span>
      </div>
      <select class="filter-select" style="padding:.3rem .6rem;font-size:.82rem;" onchange="showToast('Role updated for ${u.name}','success')">
        ${roles.map(r=>`<option${r.name===u.role?' selected':''}>${r.name}</option>`).join('')}
      </select>
      <span style="font-size:.75rem;color:var(--gray-400);margin-left:.75rem;min-width:90px;text-align:right;">Last: ${u.last}</span>
    </div>`;
  }).join('');
}
renderUsers(users);
document.getElementById('userSearch').addEventListener('input',function(){
  renderUsers(users.filter(u=>u.name.toLowerCase().includes(this.value.toLowerCase())||u.email.toLowerCase().includes(this.value.toLowerCase())));
});
document.getElementById('roleFilter').addEventListener('change',function(){
  renderUsers(this.value?users.filter(u=>u.role===this.value):users);
});

// Audit log
const audit=[
  {user:'Admin User', action:'Permission changed', target:'HR Specialist — Delete Employees', date:'Sep 16, 2026 09:14', ip:'192.168.1.5'},
  {user:'Admin User', action:'Role created',       target:'Recruiter',                        date:'Sep 15, 2026 14:32', ip:'192.168.1.5'},
  {user:'Admin User', action:'Role assigned',      target:'Amara Diallo → HR Manager',       date:'Sep 15, 2026 14:30', ip:'192.168.1.5'},
  {user:'Admin User', action:'User login',         target:'Admin dashboard',                  date:'Sep 16, 2026 08:55', ip:'192.168.1.5'},
  {user:'Admin User', action:'Permission changed', target:'Manager — Approve All Leave: OFF', date:'Sep 14, 2026 11:02', ip:'192.168.1.8'},
  {user:'Admin User', action:'Role deleted',       target:'Temp Contractor',                  date:'Sep 10, 2026 16:45', ip:'192.168.1.5'},
];
document.getElementById('auditBody').innerHTML=audit.map(a=>`<tr>
  <td><strong>${a.user}</strong></td>
  <td>${a.action}</td>
  <td style="font-size:.83rem;color:var(--gray-600);">${a.target}</td>
  <td style="font-size:.83rem;">${a.date}</td>
  <td style="font-size:.8rem;color:var(--gray-400);">${a.ip}</td>
</tr>`).join('');

document.getElementById('newRoleForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=new FormData(e.target).get('name');
  closeModal('newRoleModal');
  e.target.reset();
  showToast(`Role "${name}" created!`,'success');
});
</script>
</body>
</html>
