<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Training — PeopleCore HR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body{background:#f8fafc;}
    .dash-layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
    .sidebar{background:var(--dark);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
    .sidebar-logo{padding:1.25rem 1.25rem 0;display:flex;align-items:center;gap:.55rem;font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:1rem;}
    .sidebar-logo .logo-icon{width:32px;height:32px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:.9rem;}
    .sidebar-divider{height:1px;background:rgba(255,255,255,.08);margin:.5rem 1rem;}
    .sidebar-nav{flex:1;padding:0 .75rem;}
    .sidebar-footer{padding:1rem;border-top:1px solid rgba(255,255,255,.08);}
    .user-chip{display:flex;align-items:center;gap:.65rem;padding:.6rem .5rem;border-radius:8px;}
    .user-chip .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff;flex-shrink:0;}
    .user-chip strong{display:block;font-size:.85rem;color:#fff;line-height:1.2;}
    .user-chip span{font-size:.75rem;color:rgba(255,255,255,.4);}
    .dash-main{padding:2rem;overflow-y:auto;}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}

    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1.25rem;margin-bottom:2rem;}
    .kpi-card{background:#fff;border-radius:14px;padding:1.4rem;box-shadow:0 1px 3px rgba(0,0,0,.08);}
    .kpi-icon{font-size:1.4rem;margin-bottom:.4rem;}
    .kpi-val{font-size:1.9rem;font-weight:800;line-height:1;color:var(--gray-900);}
    .kpi-lbl{font-size:.82rem;color:var(--gray-500);}

    .sc{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:1.5rem;overflow:hidden;}
    .sc-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.5rem;border-bottom:1px solid var(--gray-100);}
    .sc-head h3{margin:0;font-size:1rem;}
    .sc-body{padding:1.5rem;}

    /* Course card */
    .course-card{border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:box-shadow .2s,transform .2s;display:flex;flex-direction:column;}
    .course-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.12);transform:translateY(-2px);}
    .course-thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;}
    .course-body{padding:1rem;flex:1;display:flex;flex-direction:column;}
    .course-title{font-weight:700;font-size:.95rem;color:var(--gray-900);margin-bottom:.35rem;}
    .course-meta{font-size:.78rem;color:var(--gray-500);display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.65rem;}
    .course-meta span{display:flex;align-items:center;gap:.25rem;}
    .course-desc{font-size:.82rem;color:var(--gray-600);line-height:1.55;flex:1;}
    .course-footer{padding:.85rem 1rem;border-top:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;}
    .course-progress-wrap{flex:1;margin:0 .85rem;}
    .course-progress-track{height:6px;background:var(--gray-100);border-radius:999px;overflow:hidden;}
    .course-progress-fill{height:100%;border-radius:999px;background:var(--primary);}

    /* Enrollment row */
    .enroll-row{display:flex;align-items:center;gap:.75rem;padding:.85rem 1.25rem;border-bottom:1px solid var(--gray-100);transition:background .2s;}
    .enroll-row:hover{background:var(--gray-100);}
    .enroll-row:last-child{border-bottom:none;}
    .enroll-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;color:#fff;flex-shrink:0;}

    .cert-badge{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;}
    .cert-badge .icon{font-size:1.8rem;flex-shrink:0;}
    .cert-badge strong{display:block;font-size:.9rem;}
    .cert-badge span{font-size:.76rem;opacity:.8;}

    @media(max-width:1024px){.dash-layout{grid-template-columns:1fr;}.sidebar{display:none;}}
    @media(max-width:768px){.course-grid{grid-template-columns:1fr!important;}}
  </style>
</head>
<body>
<div class="dash-layout">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="dash-main">
    <div class="topbar">
      <div>
        <h2>🎓 Training & Development</h2>
        <p style="margin:0;font-size:.88rem;color:var(--gray-500);">Manage courses, track progress, and develop your team.</p>
      </div>
      <div style="display:flex;gap:.75rem;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="showToast('Training report exported','info')">⬇ Export</button>
        <button class="btn btn-primary" data-modal-open="addCourseModal">+ Add Course</button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-icon">📚</div><div class="kpi-val">42</div><div class="kpi-lbl">Active Courses</div></div>
      <div class="kpi-card"><div class="kpi-icon">👥</div><div class="kpi-val">186</div><div class="kpi-lbl">Enrolled Employees</div></div>
      <div class="kpi-card"><div class="kpi-icon">✅</div><div class="kpi-val">74%</div><div class="kpi-lbl">Completion Rate</div></div>
      <div class="kpi-card"><div class="kpi-icon">🏆</div><div class="kpi-val">312</div><div class="kpi-lbl">Certificates Issued</div></div>
      <div class="kpi-card"><div class="kpi-icon">⏱️</div><div class="kpi-val">18h</div><div class="kpi-lbl">Avg Learning / Employee</div></div>
    </div>

    <!-- Tabs -->
    <div data-tabs>
      <div class="tabs">
        <button class="tab-btn active" data-tab="catalog">Course Catalog</button>
        <button class="tab-btn" data-tab="enrolled">My Enrollments</button>
        <button class="tab-btn" data-tab="progress">Team Progress</button>
        <button class="tab-btn" data-tab="certs">Certificates</button>
      </div>

      <!-- CATALOG -->
      <div class="tab-panel active" id="tab-catalog">
        <div style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem;">
          <input class="search-input" style="flex:1;min-width:200px;padding:.5rem .9rem;font-size:.88rem;" placeholder="🔍 Search courses…" id="courseSearch"/>
          <select class="filter-select" id="catFilter">
            <option value="">All Categories</option>
            <option>Leadership</option><option>Technical</option><option>Compliance</option>
            <option>Soft Skills</option><option>Onboarding</option>
          </select>
          <select class="filter-select" id="levelFilter">
            <option value="">All Levels</option>
            <option>Beginner</option><option>Intermediate</option><option>Advanced</option>
          </select>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem;" id="courseGrid"></div>
      </div>

      <!-- ENROLLED -->
      <div class="tab-panel" id="tab-enrolled">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem;" id="enrolledGrid"></div>
      </div>

      <!-- TEAM PROGRESS -->
      <div class="tab-panel" id="tab-progress">
        <div class="sc">
          <div class="sc-head">
            <h3>Team Training Progress</h3>
            <select class="filter-select" style="padding:.35rem .7rem;font-size:.85rem;">
              <option>All Courses</option><option>Mandatory Only</option>
            </select>
          </div>
          <div style="overflow-x:auto;">
            <table class="data-table" id="progressTable">
              <thead><tr><th>Employee</th><th>Course</th><th>Progress</th><th>Due Date</th><th>Status</th><th>Action</th></tr></thead>
              <tbody id="progressBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- CERTIFICATES -->
      <div class="tab-panel" id="tab-certs">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem;" id="certsGrid"></div>
      </div>
    </div>
  </main>
</div>

<!-- Add Course Modal -->
<div class="modal-overlay" id="addCourseModal">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header"><h3>Add New Course</h3><button class="modal-close" data-modal-close="addCourseModal">✕</button></div>
    <div class="modal-body">
      <form id="courseForm">
        <div class="form-group"><label class="form-label">Course Title *</label><input name="title" class="form-control" placeholder="e.g. Advanced Leadership Skills" required/></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Category</label>
            <select name="cat" class="form-control"><option>Leadership</option><option>Technical</option><option>Compliance</option><option>Soft Skills</option><option>Onboarding</option></select></div>
          <div class="form-group"><label class="form-label">Level</label>
            <select name="level" class="form-control"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Duration</label><input name="dur" class="form-control" placeholder="e.g. 4 hours"/></div>
          <div class="form-group"><label class="form-label">Due Date</label><input type="date" name="due" class="form-control"/></div>
        </div>
        <div class="form-group"><label class="form-label">Description</label><textarea name="desc" class="form-control" rows="3" placeholder="What will employees learn?"></textarea></div>
        <div class="form-group">
          <label class="form-label">Assign To</label>
          <select name="assign" class="form-control"><option>All Employees</option><option>Engineering</option><option>Sales</option><option>Design</option><option>HR</option></select>
        </div>
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;">
          <input type="checkbox" id="mandatory" name="mandatory" style="width:16px;height:16px;cursor:pointer;"/>
          <label for="mandatory" style="font-size:.88rem;font-weight:600;cursor:pointer;">Mark as mandatory</label>
        </div>
        <div class="modal-footer" style="padding:0;border:none;margin-top:.5rem;">
          <button type="button" class="btn btn-outline" data-modal-close="addCourseModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Publish Course</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="sidebar.js"></script>
<script>
const courses=[
  {id:1,title:'Leadership Fundamentals',cat:'Leadership',level:'Intermediate',dur:'6h',icon:'👔',bg:'#dbeafe',enrolled:48,rating:4.7,desc:'Core leadership principles for new and aspiring managers covering communication, delegation, and team motivation.',mandatory:true},
  {id:2,title:'Workplace Safety & Compliance',cat:'Compliance',level:'Beginner',dur:'2h',icon:'🦺',bg:'#fef3c7',enrolled:248,rating:4.5,desc:'Annual mandatory compliance training covering safety procedures, HR policies, and legal obligations.',mandatory:true},
  {id:3,title:'React & TypeScript Mastery',cat:'Technical',level:'Advanced',dur:'12h',icon:'⚛️',bg:'#ede9fe',enrolled:32,rating:4.9,desc:'Deep-dive into modern frontend development with React 18, TypeScript, and testing best practices.',mandatory:false},
  {id:4,title:'Effective Communication',cat:'Soft Skills',level:'Beginner',dur:'3h',icon:'💬',bg:'#dcfce7',enrolled:94,rating:4.6,desc:'Improve written and verbal communication skills for more impactful meetings, emails, and presentations.',mandatory:false},
  {id:5,title:'Data Analysis with Excel',cat:'Technical',level:'Intermediate',dur:'5h',icon:'📊',bg:'#e0f2fe',enrolled:61,rating:4.3,desc:'Master advanced Excel features including pivot tables, VLOOKUP, and data visualisation techniques.',mandatory:false},
  {id:6,title:'New Employee Onboarding',cat:'Onboarding',level:'Beginner',dur:'4h',icon:'🚀',bg:'#fee2e2',enrolled:18,rating:4.8,desc:'Comprehensive introduction to company culture, policies, tools, and processes for new joiners.',mandatory:true},
  {id:7,title:'Conflict Resolution',cat:'Soft Skills',level:'Intermediate',dur:'3.5h',icon:'🤝',bg:'#fef3c7',enrolled:72,rating:4.4,desc:'Practical frameworks for managing difficult conversations and resolving workplace conflicts constructively.',mandatory:false},
  {id:8,title:'Cybersecurity Essentials',cat:'Compliance',level:'Beginner',dur:'2.5h',icon:'🔒',bg:'#f1f5f9',enrolled:248,rating:4.6,desc:'Protect company data and systems — covers phishing, password hygiene, data privacy, and incident reporting.',mandatory:true},
];

function renderCourses(data){
  const grid=document.getElementById('courseGrid');
  grid.innerHTML=data.map(c=>`
    <div class="course-card">
      <div class="course-thumb" style="background:${c.bg};">${c.icon}</div>
      <div class="course-body">
        <div style="display:flex;gap:.4rem;margin-bottom:.5rem;flex-wrap:wrap;">
          <span class="badge badge-blue" style="font-size:.68rem;">${c.cat}</span>
          <span class="badge badge-purple" style="font-size:.68rem;">${c.level}</span>
          ${c.mandatory?'<span class="badge badge-red" style="font-size:.68rem;">Mandatory</span>':''}
        </div>
        <div class="course-title">${c.title}</div>
        <div class="course-meta">
          <span>⏱ ${c.dur}</span>
          <span>⭐ ${c.rating}</span>
          <span>👥 ${c.enrolled} enrolled</span>
        </div>
        <div class="course-desc">${c.desc}</div>
      </div>
      <div class="course-footer">
        <button class="btn btn-primary btn-sm" onclick="enrollCourse('${c.title}')">Enroll</button>
        <button class="btn btn-outline btn-sm" onclick="showToast('Opening ${c.title}…','info')">Preview</button>
      </div>
    </div>`).join('');
}
renderCourses(courses);

function enrollCourse(title){
  showToast(`Enrolled in "${title}"!`,'success');
}

// Filters
document.getElementById('courseSearch').addEventListener('input',applyFilters);
document.getElementById('catFilter').addEventListener('change',applyFilters);
document.getElementById('levelFilter').addEventListener('change',applyFilters);
function applyFilters(){
  const q=document.getElementById('courseSearch').value.toLowerCase();
  const cat=document.getElementById('catFilter').value;
  const lvl=document.getElementById('levelFilter').value;
  renderCourses(courses.filter(c=>
    c.title.toLowerCase().includes(q) &&
    (!cat||c.cat===cat) &&
    (!lvl||c.level===lvl)
  ));
}

// Enrolled tab
const myEnrolled=[
  {title:'Leadership Fundamentals',icon:'👔',bg:'#dbeafe',pct:65,dur:'6h',status:'In Progress'},
  {title:'Workplace Safety',       icon:'🦺',bg:'#fef3c7',pct:100,dur:'2h',status:'Completed'},
  {title:'Cybersecurity Essentials',icon:'🔒',bg:'#f1f5f9',pct:40, dur:'2.5h',status:'In Progress'},
  {title:'New Employee Onboarding',icon:'🚀',bg:'#fee2e2',pct:100,dur:'4h',status:'Completed'},
];
const eg=document.getElementById('enrolledGrid');
myEnrolled.forEach(c=>{
  const sc=c.status==='Completed'?'badge-green':'badge-yellow';
  eg.innerHTML+=`<div class="course-card">
    <div class="course-thumb" style="background:${c.bg};">${c.icon}</div>
    <div class="course-body">
      <div class="course-title">${c.title}</div>
      <div class="course-meta"><span>⏱ ${c.dur}</span><span class="badge ${sc}" style="font-size:.68rem;">${c.status}</span></div>
    </div>
    <div class="course-footer">
      <span style="font-size:.78rem;color:var(--gray-500);">${c.pct}% complete</span>
      <div class="course-progress-wrap"><div class="course-progress-track"><div class="course-progress-fill" style="width:${c.pct}%;background:${c.pct===100?'var(--success)':'var(--primary)'};"></div></div></div>
      <button class="btn btn-primary btn-sm" onclick="showToast('${c.status==='Completed'?'Certificate opened':'Resuming course'}','${c.status==='Completed'?'success':'info'}')">${c.status==='Completed'?'Certificate':'Resume'}</button>
    </div>
  </div>`;
});

// Team Progress
const progressData=[
  {name:'Sarah Mitchell',init:'SM',col:'#2563eb',course:'Leadership Fundamentals',pct:65, due:'Oct 15',status:'In Progress'},
  {name:'James Okafor',  init:'JO',col:'#16a34a',course:'React & TypeScript',      pct:90, due:'Sep 30',status:'In Progress'},
  {name:'Carlos Rivera', init:'CR',col:'#0ea5e9',course:'Effective Communication', pct:100,due:'Sep 20',status:'Completed'},
  {name:'Elena Vasquez', init:'EV',col:'#7c3aed',course:'Conflict Resolution',     pct:30, due:'Oct 30',status:'In Progress'},
  {name:'Tom Henderson', init:'TH',col:'#dc2626',course:'Workplace Safety',         pct:100,due:'Sep 1', status:'Completed'},
  {name:'Amara Diallo',  init:'AD',col:'#d97706',course:'Data Analysis w/ Excel',  pct:50, due:'Oct 10',status:'In Progress'},
  {name:'Liu Wei',       init:'LW',col:'#0f172a',course:'New Employee Onboarding', pct:60, due:'Sep 30',status:'In Progress'},
  {name:'Priya Nair',    init:'PN',col:'#ef4444',course:'Cybersecurity Essentials',pct:0,  due:'Oct 1', status:'Not Started'},
];
document.getElementById('progressBody').innerHTML=progressData.map(r=>{
  const sc=r.status==='Completed'?'badge-green':r.status==='In Progress'?'badge-yellow':'badge-red';
  return `<tr>
    <td><div class="employee-info"><div class="employee-avatar" style="background:${r.col};">${r.init}</div><span class="employee-name">${r.name}</span></div></td>
    <td style="font-size:.88rem;">${r.course}</td>
    <td><div style="display:flex;align-items:center;gap:.5rem;">
      <div style="width:100px;height:6px;background:var(--gray-100);border-radius:999px;overflow:hidden;"><div style="width:${r.pct}%;height:100%;background:${r.pct===100?'var(--success)':'var(--primary)'};border-radius:999px;"></div></div>
      <span style="font-size:.78rem;font-weight:700;">${r.pct}%</span>
    </div></td>
    <td style="font-size:.85rem;">${r.due}</td>
    <td><span class="badge ${sc}">${r.status}</span></td>
    <td><button class="btn btn-outline btn-sm" onclick="showToast('Sending reminder to ${r.name}','info')">Remind</button></td>
  </tr>`;
}).join('');

// Certs
const certs=[
  {name:'Sarah Mitchell',course:'Effective Communication',date:'Sep 1, 2026',col:'#2563eb',init:'SM'},
  {name:'Tom Henderson', course:'Workplace Safety & Compliance',date:'Aug 15, 2026',col:'#dc2626',init:'TH'},
  {name:'Carlos Rivera', course:'Effective Communication',date:'Sep 5, 2026',col:'#0ea5e9',init:'CR'},
  {name:'Ana Costa',     course:'New Employee Onboarding',date:'Aug 30, 2026',col:'#16a34a',init:'AC'},
  {name:'Jake Morris',   course:'Cybersecurity Essentials',date:'Aug 20, 2026',col:'#7c3aed',init:'JM'},
  {name:'Mei Lin',       course:'Data Analysis with Excel',date:'Jul 28, 2026',col:'#d97706',init:'ML'},
];
const cg=document.getElementById('certsGrid');
certs.forEach(c=>{
  cg.innerHTML+=`<div class="cert-badge">
    <div class="icon">🏆</div>
    <div>
      <strong>${c.course}</strong>
      <span>Awarded to ${c.name} · ${c.date}</span>
    </div>
    <button class="btn btn-ghost btn-sm" style="margin-left:auto;flex-shrink:0;" onclick="showToast('Certificate downloaded','success')">⬇</button>
  </div>`;
});

// Form
document.getElementById('courseForm').addEventListener('submit',e=>{
  e.preventDefault();
  closeModal('addCourseModal');
  e.target.reset();
  showToast('Course published successfully!','success');
});
</script>
</body>
</html>
